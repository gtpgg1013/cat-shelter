<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Cat Cafe</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <div id="game-container"></div>
  <div id="toolbar">
    <button class="tool-btn active" data-tool="pet">
      <span class="tool-icon">🖐️</span>
      <span class="tool-label">쓰다듬기</span>
    </button>
    <button class="tool-btn" data-tool="treat">
      <span class="tool-icon">🐟</span>
      <span class="tool-label">간식</span>
    </button>
    <button class="tool-btn" data-tool="toy">
      <span class="tool-icon">🪶</span>
      <span class="tool-label">장난감</span>
    </button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
